name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.3.0)"
        required: true
        type: string
      latest:
        description: "Also tag the Docker image as :latest"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && (index($0, "## [") == 1 || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE_FLAG=""
          case "$RELEASE_TAG" in
            *-*) PRE_FLAG="--prerelease" ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -s release-notes.md ]; then
              gh release edit "$RELEASE_TAG" \
                --title "$RELEASE_TAG" \
                --notes-file release-notes.md \
                $PRE_FLAG
            fi
          elif [ -s release-notes.md ]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              $PRE_FLAG
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes \
              $PRE_FLAG
          fi

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || inputs.latest == true }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
